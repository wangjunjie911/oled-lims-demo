<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OLED_LIMS APP Demo</title>
<style>
:root{
  --primary:#1677FF;--primary-hover:#4096FF;--primary-soft:#E8F3FF;
  --text:#1D2129;--text-2:#4E5969;--text-3:#86909C;--placeholder:#C0C4CC;
  --border:#F0F1F3;--border-input:#E5E6EB;--bg:#F5F6F8;--danger:#FF4D4F;
  --ok:#00B42A;--badge:#FF4D4F;--warn:#FF8C1A;--warn-soft:#FFF7E8;
  --btn-blue:#1989FA;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;color:var(--text-2);background:var(--bg)}
button,input{font-family:inherit}
button{cursor:pointer}
.desk{min-height:100%;display:flex;flex-direction:column}
.desk-bar{height:52px;padding:0 20px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.desk-brand{font-size:15px;font-weight:600;color:var(--text)}
.mode-switch{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.mode-switch a{padding:6px 14px;font-size:13px;line-height:1.2;text-decoration:none;color:var(--text-2);background:#fff}
.mode-switch a:hover{color:var(--primary)}
.mode-switch a.on{background:var(--primary);color:#fff}
.back-overview{
  display:inline-flex;align-items:center;padding:6px 12px;font-size:13px;line-height:1.2;
  border:1px solid var(--border);border-radius:4px;background:#fff;
  color:var(--text-2);text-decoration:none;white-space:nowrap;flex-shrink:0;
}
.back-overview:hover{border-color:var(--primary);color:var(--primary)}
.desk-bar__actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* ---------- 页面备注（与 PC 端一致：顶栏「备注」按钮 + 右侧抽屉） ---------- */
.remarks-btn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:13px;line-height:1.2;
  border:1px solid var(--border);border-radius:4px;background:#fff;
  color:var(--text-2);cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.remarks-btn:hover{border-color:var(--primary);color:var(--primary)}
.remarks-btn.on{color:#fff;background:var(--primary);border-color:var(--primary)}
.remarks-btn svg{width:14px;height:14px}
.remarks-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:9999;
  background:#fff;border-left:1px solid var(--border);
  box-shadow:-4px 0 16px rgba(0,0,0,.08);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .22s ease;
}
.remarks-drawer.is-open{transform:translateX(0)}
.remarks-drawer__hd{
  flex-shrink:0;height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:#FAFAFA;
}
.remarks-drawer__title{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remarks-drawer__close{width:28px;height:28px;border:none;border-radius:4px;background:transparent;color:var(--text-3);font-size:18px;line-height:1;cursor:pointer}
.remarks-drawer__close:hover{background:rgba(0,0,0,.06);color:var(--text)}
.remarks-drawer__body{flex:1;min-height:0;overflow:auto;padding:16px 18px 24px}
.remarks-sec{margin-bottom:18px}
.remarks-sec__h{margin:0 0 10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:4px}
.remarks-sec__p{margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--text-2)}
.remarks-sec__list{margin:6px 0 0;padding-left:1.35em;font-size:13px;line-height:1.7;color:var(--text-2)}
.remarks-sec__list li{margin-bottom:4px}
.remarks-field{margin:0 0 10px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#FBFCFE}
.remarks-field__name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.remarks-sec__ol{margin:0;padding-left:1.6em;font-size:12.5px;line-height:1.65;color:var(--text-2)}
.remarks-sec__ol li{margin-bottom:4px}
@media (max-width:380px){
  .remarks-btn span{display:none}
  .remarks-btn{padding:6px 9px}
}
/* ---------- 重置 / 版本公告（与 PC 端顶栏一致） ---------- */
.sync-chip{flex-shrink:0;height:30px;padding:0 12px;border:1px solid #C5D4EB;border-radius:4px;background:#E8F3FF;color:var(--primary);font-size:12px;cursor:pointer;white-space:nowrap}
.sync-chip:hover{background:#DCEBFF}
.announce-bell{position:relative;flex-shrink:0;width:30px;height:30px;padding:0;border:1px solid #C5D4EB;border-radius:4px;background:#fff;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.announce-bell:hover{border-color:var(--primary);background:var(--primary-soft)}
.announce-bell svg{width:15px;height:15px;display:block}
.announce-bell__dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#F5222D;border:1px solid #fff;pointer-events:none;display:none}
.announce-bell.unread .announce-bell__dot{display:block}
.announce-mask{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.announce-mask.on{display:flex}
.announce-modal{width:min(560px,100%);max-height:min(80vh,640px);background:#fff;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.announce-modal__hd{flex-shrink:0;height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.announce-modal__title{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.announce-modal__close{width:28px;height:28px;border:none;border-radius:4px;background:transparent;color:var(--text-3);font-size:18px;line-height:1;cursor:pointer;flex-shrink:0}
.announce-modal__close:hover{background:rgba(0,0,0,.06);color:var(--text)}
.announce-tabs{flex-shrink:0;display:flex;border-bottom:1px solid var(--border);background:#FAFAFA}
.announce-tab{flex:1;height:40px;border:none;background:transparent;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent}
.announce-tab.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
.announce-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 20px}
.announce-note{margin-bottom:14px}
.announce-note__title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.announce-note__body{font-size:12.5px;line-height:1.65;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.announce-upd{margin-bottom:12px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:#FBFCFE}
.announce-upd__top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.announce-upd__ver{font-size:12px;font-weight:600;color:var(--primary);word-break:break-all}
.announce-upd__term{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--primary-soft);color:var(--primary)}
.announce-upd__date{font-size:11px;color:var(--text-3);margin-left:auto}
.announce-upd__sum{font-size:12.5px;line-height:1.55;color:var(--text-2)}
.announce-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.announce-kpi__item{background:#F7F8FA;border:1px solid var(--border);border-radius:6px;padding:10px 4px;text-align:center}
.announce-kpi__num{font-size:18px;font-weight:700;color:var(--text);line-height:1.2}
.announce-kpi__lab{font-size:11px;color:var(--text-3);margin-top:4px}
.announce-prog{margin-bottom:8px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:#FBFCFE}
.announce-prog__m3{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.announce-prog__dev{font-size:12px;color:var(--text-2)}
.announce-prog__dev.ready{color:var(--ok)}
.announce-modal__ft{flex-shrink:0;display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.announce-btn{height:32px;padding:0 16px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text-2);font-size:13px;cursor:pointer}
.announce-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.announce-btn.primary:hover{background:var(--primary-hover)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.phone{width:min(390px,100%);height:min(844px,calc(100vh - 84px));background:#fff;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
/* 各 panel 必须为纵向 flex，否则内层滚动容器(flex:1)无法被高度约束，导致内容撑爆、无法滚动且把 tabbar 挤出可视区 */
#panel-home,#panel-msg,#panel-approve,#panel-mine,#panel-module{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* ---------- 忘记密码页（保留原表单样式） ---------- */
.sheet{flex:1;min-height:0;background:#fff;padding:12px 20px 20px;overflow:auto}
.field{margin-bottom:14px}
.field-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;color:var(--text-2)}
.field input{width:100%;height:40px;border:1px solid var(--border-input);border-radius:4px;padding:0 12px;font-size:16px;color:var(--text);background:#fff}
.field input::placeholder{color:var(--placeholder)}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.16)}
.pwd{position:relative}
.pwd input{padding-right:44px}
.eye{position:absolute;right:0;top:0;width:40px;height:40px;border:0;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center}
.eye svg{width:18px;height:18px}
.ghost{height:40px;padding:0 10px;border:1px solid var(--primary);border-radius:4px;background:#fff;color:var(--primary);font-size:13px;white-space:nowrap}
.ghost:disabled{color:var(--placeholder);border-color:var(--border);background:var(--bg)}
.sms{display:flex;gap:8px}
.sms input{flex:1;min-width:0}
.sms-hint{margin-top:6px;font-size:12px;color:var(--primary);line-height:1.5}
.err{min-height:18px;margin:-4px 0 8px;font-size:12px;color:var(--danger);line-height:1.4}
.btn{width:100%;height:40px;border:0;border-radius:4px;background:var(--primary);color:#fff;font-size:15px}
.btn:hover{background:var(--primary-hover)}
.steps{display:flex;gap:16px;margin:4px 0 16px;font-size:13px;color:var(--text-3)}
.steps .on{color:var(--primary);font-weight:600}
/* ---------- 顶栏 ---------- */
.subhead{height:48px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;background:#fff;flex-shrink:0;border-bottom:1px solid var(--border)}
.subhead h2{margin:0;font-size:16px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.subhead h2.shift-l{padding-right:52px}
.icon-btn{width:36px;height:36px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.head-link{border:0;background:transparent;color:var(--primary);font-size:14px;padding:8px;flex-shrink:0}
/* ---------- 页面标题栏（首页/消息/审批/我的） ---------- */
.page-head{height:48px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-head h1{margin:0;font-size:17px;font-weight:600;color:var(--text)}
.list-body,.home-body,.mine-body{flex:1;min-height:0;overflow:auto;padding:12px;background:var(--bg)}
/* ---------- 首页分组卡片 ---------- */
.group-card{background:#fff;border-radius:8px;margin-bottom:12px;overflow:hidden}
.group-title{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;color:var(--text)}
.group-title svg{width:18px;height:18px;color:var(--primary);flex-shrink:0}
.icon-grid{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 8px 24px;row-gap:24px}
.icon-item{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px}
.icon-item .ico{width:44px;height:44px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.icon-item .ico svg{width:22px;height:22px}
.icon-item .lbl{font-size:13px;color:var(--text);line-height:1.3;text-align:center}
.badge{position:absolute;top:-7px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--badge);color:#fff;font-size:11px;line-height:18px;font-weight:500;font-style:normal;text-align:center}
/* ---------- 搜索栏 ---------- */
.search-bar{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);flex-shrink:0}
.search-input{flex:1;height:36px;border-radius:6px;border:0;background:#EDEFF2;display:flex;align-items:center;gap:6px;padding:0 10px}
.search-input svg{width:15px;height:15px;color:var(--placeholder);flex-shrink:0}
.search-input input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;color:var(--text)}
.search-input input::placeholder{color:var(--placeholder)}
.search-bar .q-btn{border:0;background:transparent;color:var(--text-2);font-size:14px;padding:4px 2px}
.scan-btn{width:36px;height:36px;flex-shrink:0;border:0;border-radius:6px;background:#EDEFF2;color:var(--primary);display:flex;align-items:center;justify-content:center}
.scan-btn svg{width:20px;height:20px}
.scan-btn:active{background:#DCEBFF}
/* ---------- 模拟扫码遮罩 ---------- */
.scan-mask{position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.scan-box{width:min(300px,86vw);background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.scan-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px}
.scan-view{position:relative;width:200px;height:200px;border-radius:8px;background:linear-gradient(135deg,#0b3a75,#1355a8);overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan-view::before{content:'';position:absolute;left:16px;top:16px;width:34px;height:34px;border-left:3px solid #7dd3fc;border-top:3px solid #7dd3fc;border-top-left-radius:6px}
.scan-view::after{content:'';position:absolute;right:16px;bottom:16px;width:34px;height:34px;border-right:3px solid #7dd3fc;border-bottom:3px solid #7dd3fc;border-bottom-right-radius:6px}
.scan-view .scan-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:linear-gradient(90deg,transparent,#7dd3fc,transparent);box-shadow:0 0 10px #7dd3fc;animation:scanmove 1.1s ease-in-out infinite}
@keyframes scanmove{0%,100%{transform:translateY(-70px)}50%{transform:translateY(70px)}}
.scan-tip{margin-top:14px;font-size:12px;color:var(--text-3);text-align:center}
/* ---------- 单据卡片 ---------- */
.doc-list{padding:2px 12px 16px}
.doc-card{background:#fff;border-radius:8px;margin-bottom:12px;overflow:hidden}
.doc-head{position:relative;height:42px;background:linear-gradient(90deg,#CFE3FF 0%,#E8F2FF 100%);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--text)}
.status-tag{position:absolute;right:12px;top:50%;transform:translateY(-50%);padding:2px 10px;border-radius:11px;font-size:12px;line-height:18px;white-space:nowrap}
.status-tag.wait{background:var(--warn-soft);color:var(--warn)}
.status-tag.run{background:var(--primary-soft);color:var(--primary)}
.status-tag.done{background:#E8FFEA;color:var(--ok)}
.status-tag.fail{background:#FFECE8;color:var(--danger)}
.doc-body{padding:6px 16px 8px}
.kv{display:flex;min-height:32px;font-size:13px;line-height:32px;align-items:flex-start}
.kv .k{width:82px;color:var(--text-3);flex-shrink:0}
.kv .v{flex:1;color:var(--text);word-break:break-all;line-height:32px}
.kv-row{display:flex}
.kv-row .kv{flex:1;min-width:0}
.kv-row .kv .k{width:76px}
.doc-foot{display:flex;justify-content:flex-end;padding:4px 16px 14px}
.pill-btn{padding:5px 16px;border:1px solid var(--primary);border-radius:15px;background:#fff;color:var(--primary);font-size:13px;line-height:1.3}
.pill-btn:active{background:var(--primary-soft)}
.empty-tip{padding:40px 0;text-align:center;font-size:13px;color:var(--text-3)}
/* ---------- 表单（新增/详情编辑区） ---------- */
.form-wrap{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
.group-label{padding:18px 16px 0 36px;font-size:13px;color:var(--text-3)}
.fi{padding:0 16px}
.fi .fl{display:flex;align-items:center;margin:14px 0 8px;font-size:14px;color:var(--text);line-height:1.4}
.fi .fl i{color:var(--danger);font-style:normal;margin-right:3px;font-size:14px}
.fi input{width:100%;height:40px;border:0;border-radius:4px;background:#F7F8FA;padding:0 12px;font-size:14px;color:var(--text);outline:none}
.fi input::placeholder{color:var(--placeholder)}
.fi .auto{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:4px;background:#F7F8FA;font-size:14px;color:var(--placeholder)}
.fi .val{min-height:40px;display:flex;align-items:center;padding:0 12px;border-radius:4px;background:#F7F8FA;font-size:14px;color:var(--text);word-break:break-all}
.retain-no{display:flex;align-items:center;gap:8px}
.retain-no .no-val{flex:1;min-width:0;height:40px;display:flex;align-items:center;padding:0 12px;border-radius:4px;background:#F7F8FA;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retain-no .no-refresh{flex-shrink:0;height:40px;padding:0 12px;border:1px solid var(--primary);border-radius:4px;background:#fff;color:var(--primary);font-size:13px}
.retain-no .no-refresh:active{background:var(--primary-soft)}
.scan-row{display:flex;align-items:center;gap:8px}
.scan-row input{flex:1;min-width:0;height:40px;border:0;border-radius:4px;background:#F7F8FA;padding:0 12px;font-size:14px;color:var(--text);outline:none}
.scan-row input::placeholder{color:var(--placeholder)}
.scan-row .scan-mini{flex-shrink:0;height:40px;padding:0 14px;border:0;border-radius:4px;background:var(--primary);color:#fff;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.scan-row .scan-mini:active{background:var(--primary-hover)}
.scan-row .scan-mini svg{width:16px;height:16px}
.fi .sel{height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-radius:4px;background:#F7F8FA;font-size:14px}
.fi .sel .sel-ph{color:var(--placeholder)}
.fi .sel.has-val .sel-ph{color:var(--text)}
.fi .sel .chev{width:14px;height:14px;color:var(--placeholder);flex-shrink:0}
.fi .form-gap{height:6px}
.stepper{display:inline-flex;align-items:center;height:28px;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:#fff}
.stepper button{width:28px;height:100%;border:0;background:#F7F8FA;color:var(--text-2);font-size:14px;line-height:1;padding:0}
.stepper input{width:60px;height:100%;border:0;outline:none;text-align:center;font-size:12px;color:var(--text-2);background:#fff;padding:0}
/* ---------- 详情页 ---------- */
.detail-banner{height:56px;background:linear-gradient(180deg,#CBE1FF 0%,#EDF4FF 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:14px;color:var(--text-2);flex-shrink:0}
.detail-kv{background:#fff;padding:6px 16px 14px}
.detail-sec h3{margin:18px 16px 4px;font-size:20px;font-weight:600;color:var(--text)}
.seg-tabs{display:flex;margin:0 16px;border-bottom:1px solid var(--border)}
.seg-tabs button{flex:1;height:42px;border:0;background:transparent;font-size:14px;color:var(--text-2);position:relative}
.seg-tabs button.on{color:var(--primary);font-weight:600}
.seg-tabs button.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:28px;height:2px;background:var(--primary);border-radius:1px}
.mini-table{margin:12px 16px;border:1px solid var(--border);border-radius:4px;overflow:hidden}

      items = [
        { code: 'JY-COM-01', name: '外观', type: '定性', unit: '', spec: '无异常', options: ['无异常', '有异常'] },
        { code: 'JY-COM-02', name: '标识核对', type: '定性', unit: '', spec: '一致', options: ['一致', '不一致'] }
      ];
    }
    return items.map(function (it, i) {
      var isFail = !!fail && i === 0;
      var judge = isFail ? '不合格' : '合格';
      var value;
      if (it.type === '定性') {

        else num = 100;

        if (isFail) {
          if (it.usl != null) num = it.usl + 1;
          else if (it.lsl != null) num = it.lsl - 1;
        }
        value = num + (it.unit ? ' ' + it.unit : '');

          var bc = inp.getAttribute('data-bc');
          var row = state.list.filter(function (r) { return r.sample['条码号'] === bc; })[0];
          if (row) row.remark = inp.value;

      if (!hit) { toast('该条码不在样品档案中'); return; }
      if (hit['使用状态'] !== '在用') { toast('样品使用状态非「在用」，无法入库'); return; }
      if (hit['状态'] !== '正常') { toast('样品状态非「正常」，无法入库'); return; }
      if (hit['所属仓库'] || hit['所属库位']) { toast('样品已入库，请勿重复入库'); return; }
      if (state.list.some(function (r) { return r.sample['条码号'] === code; })) { toast('该条码已扫码，请勿重复添加'); return; }
      state.list.push({ barcode: code, sample: hit, qty: hit['数量'] || '1', remark: '' });

  function renderSampleReceive(top, body) {

        (orders[t] || []).forEach(function (o) {
          (o.samples || []).forEach(function (s) {
            if (s.status === '已取样' && !s.received) {

  function renderSampleReceiveDo(top, body) {
    var sample = top.sample;
    var order = top.order;
    // 防重：已接收样品直接拒绝
    if (sample.received) {
      toast('该样品已接收，请勿重复提交');
      stack.pop();
      renderModule();
      return;
    }
    var matched = matchScheme(order.type);
    var state = {
      schemeCode: matched || '',
      items: matched ? JSON.parse(JSON.stringify(INSP_SCHEMES[matched].items)) : []
    };
    if (!matched) toast('未找到匹配的检验方案，请手动选择方案');

    var wrap = el('div', 'form-wrap');
    var banner = el('div', 'detail-banner');
    banner.textContent = '样品信息';

    var bd = el('div', 'detail-kv');
    renderRows(bd, [

      ['物料信息', order.materialText || '—'], ['采样点', sample.point || '—']

    var sec = el('div', 'detail-sec');
    sec.innerHTML = '<h3>检验方案</h3>'
      + '<div class="fi"><div class="scheme-pick"><span class="scheme-name' + (matched ? '' : ' ph') + '" id="scheme-name">' + (matched ? INSP_SCHEMES[matched].name : '请选择方案') + '</span><button type="button" class="scheme-switch" id="scheme-switch">更换方案</button></div></div>'
      + '<h3>检验项目明细</h3>';

    sec.appendChild(itemList);
    var addBtn = el('button', 'item-add-btn');
    addBtn.type = 'button';
    addBtn.textContent = '+ 新增检验项目';
    sec.appendChild(addBtn);
    wrap.appendChild(sec);

    var paintItems = function () {
      itemList.textContent = '';
      if (!state.items.length) {
        var tip = el('div', 'empty-tip');
        tip.textContent = '暂无检验项目，请新增';
        itemList.appendChild(tip);
        return;
      }
      state.items.forEach(function (it, idx) {
        var row = el('div', 'item-row');
        row.innerHTML = '<div class="item-info"><b></b><span></span></div><div class="item-ops"><button type="button" class="item-edit">编辑</button><button type="button" class="item-del">删除</button></div>';
        row.querySelector('.item-info b').textContent = it.name;
        row.querySelector('.item-info span').textContent = '[' + it.type + '] ' + (it.unit ? it.unit + ' · ' : '') + (it.spec || '');
        row.querySelector('.item-edit').onclick = function () { openProjectEditor(it, function (updated) { state.items[idx] = updated; paintItems(); }); };
        row.querySelector('.item-del').onclick = function () { state.items.splice(idx, 1); paintItems(); };
        itemList.appendChild(row);

    paintItems();

    var schemeNameEl = wrap.querySelector('#scheme-name');

    schemeSwitch.onclick = function () {
      var opts = SCHEME_CODES.map(function (c) { return INSP_SCHEMES[c].name; });
      openPicker('选择检验方案', opts, function (name) {
        var code = SCHEME_CODES.filter(function (c) { return INSP_SCHEMES[c].name === name; })[0];
        if (code) {
          state.schemeCode = code;
          state.items = JSON.parse(JSON.stringify(INSP_SCHEMES[code].items));
          schemeNameEl.textContent = name;
          schemeNameEl.classList.remove('ph');
          paintItems();
        }
      });
    };
    addBtn.onclick = function () { openProjectEditor(null, function (newItem) { state.items.push(newItem); paintItems(); }); };

    wrap.appendChild(makeSubmitBar('接收', function () {
      var orders = getOrders();

      (orders[order.type] || []).forEach(function (o) {
        if (o.id === order.id) {
          (o.samples || []).forEach(function (s) { if (s.num === sample.num) targetSample = s; });
        }
      });
      if (!targetSample) { toast('未找到该样品，接收失败'); return; }
      // 防重
      if (targetSample.received) { toast('该样品已接收，请勿重复提交'); stack.pop(); renderModule(); return; }
      // 前端校验
      if (!state.schemeCode) { toast('请选择检验方案'); return; }
      if (!state.items.length) { toast('检验项目明细不能为空'); return; }

      stack.pop();
      renderModule();

  var REMARK_PANELS = ['home', 'msg', 'approve', 'mine', 'module'];
  function remarkContext() {
    var onView = document.querySelector('.view.on');
    if (onView && onView.id === 'view-forgot') return 'forgot';
    if (onView && onView.id === 'view-main') {
      if (!$('panel-module').hidden && stack.length) {
        return 'module:' + (stack[stack.length - 1].type || 'list');
      }
      for (var i = 0; i < REMARK_PANELS.length; i++) {
        var p = $('panel-' + REMARK_PANELS[i]);
        if (p && !p.hidden) return REMARK_PANELS[i];
      }
      return 'home';
    }
    return 'login';
  }
  function updateRemarks() {
    var key = remarkContext();
    var note = APP_NOTES[key] || APP_NOTES['module:list'];
    $('remarks-title').textContent = note.title;
    var body = $('remarks-body');
    body.textContent = '';
    (note.sections || []).forEach(function (sec) {
      var s = el('section', 'remarks-sec');
      if (sec.heading) {
        var h = el('h4', 'remarks-sec__h');
        h.textContent = sec.heading;
        s.appendChild(h);
      }
      (sec.blocks || []).forEach(function (blk) {
        if (blk.type === 'list') {
          var ul = el('ul', 'remarks-sec__list');
          (blk.items || []).forEach(function (it) {
            var li = el('li');
            li.textContent = it;
            ul.appendChild(li);
          });
          s.appendChild(ul);
        } else if (blk.type === 'field') {
          var f = el('div', 'remarks-field');
          if (blk.name) {
            var fn = el('div', 'remarks-field__name');
            fn.textContent = blk.name;
            f.appendChild(fn);
          }
          var ol = el('ol', 'remarks-sec__ol');
          (blk.items || []).forEach(function (it) {
            var li = el('li');
            li.textContent = it;
            ol.appendChild(li);
          });
          f.appendChild(ol);
          s.appendChild(f);
        } else {
          var p = el('p', 'remarks-sec__p');
          p.textContent = blk.text || '';
          s.appendChild(p);
        }
      });
      body.appendChild(s);
    });
  }
  function toggleRemarks() {
    var drawer = $('remarks-drawer');
    var open = drawer.classList.toggle('is-open');
    $('btn-remarks').classList.toggle('on', open);
    if (open) updateRemarks();
  }
  $('btn-remarks').onclick = toggleRemarks;
  $('remarks-close').onclick = function () {
    $('remarks-drawer').classList.remove('is-open');
    $('btn-remarks').classList.remove('on');
  };
  updateRemarks();

  /* ==================== 版本公告（与 PC 端一致：铃铛 + 弹窗） ==================== */
  var ANNOUNCE = window.DEMO_ANNOUNCEMENTS || { notes: [], updates: [], progress: { summary: {}, rows: [] }, latestVersion: '', updatedAt: '' };
  var ANNOUNCE_DISMISS_KEY = 'xintao-qms-spc-demo-announce-dismissed';
  function announceUnread() {
    try { return localStorage.getItem(ANNOUNCE_DISMISS_KEY) !== ANNOUNCE.latestVersion; } catch (e) { return true; }
  }
  function paintAnnounceBell() {
    $('announce-bell').classList.toggle('unread', announceUnread());
  }
  function paintAnnounce(tab) {
    document.querySelectorAll('.announce-tab').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-at') === tab);
    });
    var body = $('announce-body');
    body.textContent = '';
    if (tab === 'notes') {
      (ANNOUNCE.notes || []).forEach(function (n) {
        var card = el('div', 'announce-note');
        var t = el('div', 'announce-note__title');
        t.textContent = n.title;
        var bd = el('div', 'announce-note__body');
        bd.textContent = n.body;
        card.appendChild(t);
        card.appendChild(bd);
        body.appendChild(card);
      });
    } else if (tab === 'updates') {
      (ANNOUNCE.updates || []).forEach(function (u) {
        var row = el('div', 'announce-upd');
        var top = el('div', 'announce-upd__top');
        var ver = el('span', 'announce-upd__ver');
        ver.textContent = u.version;
        var term = el('span', 'announce-upd__term');
        term.textContent = u.terminal;
        var date = el('span', 'announce-upd__date');
        date.textContent = u.date;
        top.appendChild(ver);
        top.appendChild(term);
        top.appendChild(date);
        var sum = el('div', 'announce-upd__sum');
        sum.textContent = u.summary;
        row.appendChild(top);
        row.appendChild(sum);
        body.appendChild(row);
      });
    } else {
      var s = ANNOUNCE.progress.summary || {};
      var kpi = el('div', 'announce-kpi');
      [['total', '总功能点'], ['pc', 'PC'], ['app', 'APP'], ['ready', '可开发'], ['pending', '待排期']].forEach(function (pair) {
        var item = el('div', 'announce-kpi__item');
        var num = el('div', 'announce-kpi__num');
        num.textContent = s[pair[0]] != null ? s[pair[0]] : 0;
        var lab = el('div', 'announce-kpi__lab');
        lab.textContent = pair[1];
        item.appendChild(num);
        item.appendChild(lab);
        kpi.appendChild(item);
      });
      body.appendChild(kpi);
      (ANNOUNCE.progress.rows || []).forEach(function (r) {
        var row = el('div', 'announce-prog');
        var m3 = el('div', 'announce-prog__m3');
        m3.textContent = (r.side || '') + ' · ' + (r.m1 || '') + ' / ' + (r.m2 || '') + ' / ' + (r.m3 || '');
        var dev = el('div', 'announce-prog__dev');
        dev.textContent = r.devStatus || '';
        if ((r.devStatus || '').indexOf('可开发') >= 0) dev.classList.add('ready');
        row.appendChild(m3);
        row.appendChild(dev);
        body.appendChild(row);
      });
    }
  }
  function openAnnounce() {
    $('announce-title').textContent = '版本公告 · ' + (ANNOUNCE.latestVersion || '');
    paintAnnounce('notes');
    $('announce-mask').classList.add('on');
  }
  function closeAnnounce() {
    $('announce-mask').classList.remove('on');
  }
  function dismissAnnounce() {
    try { localStorage.setItem(ANNOUNCE_DISMISS_KEY, ANNOUNCE.latestVersion); } catch (e) {}
    paintAnnounceBell();
    closeAnnounce();
  }
  $('announce-bell').onclick = openAnnounce;
  $('announce-close').onclick = closeAnnounce;
  $('announce-close2').onclick = closeAnnounce;
  $('announce-dismiss').onclick = dismissAnnounce;
  document.querySelectorAll('.announce-tab').forEach(function (b) {
    b.onclick = function () { paintAnnounce(b.getAttribute('data-at')); };
  });
  $('announce-mask').addEventListener('click', function (e) {
    if (e.target === $('announce-mask')) closeAnnounce();
  });

  /* ==================== 重置（清空 APP Demo 本地缓存，恢复初始 Mock） ==================== */
  function resetDemo() {
    if (!window.confirm('确认清空 APP Demo 本地数据？状态将恢复为初始 Mock。')) return;
    ['OLED_LIMS_APP_USERS', 'OLED_LIMS_APP_SESSION', 'OLED_LIMS_APP_ORDERS_V2'].forEach(function (k) {
      try { sessionStorage.removeItem(k); } catch (e) {}
    });
    try { localStorage.removeItem('OLED_LIMS_APP_REMEMBER'); } catch (e) {}
    location.reload();
  }
  $('btn-reset').onclick = resetDemo;
  paintAnnounceBell();

  var remembered = loadRemember();
  if (remembered.length) {
    $('account').value = remembered[0].account;
    $('remember').checked = true;
  } else {
    $('remember').checked = false;
  }
  renderHome();
  renderMsgPanel();
  renderApprovePanel();
  // 默认进入 APP 登录页（不再自动恢复上次登录态）
})();
